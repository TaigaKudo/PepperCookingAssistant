services:
 db:
  container_name: postgres
  image: postgres:17
  environment:
   - "POSTGRES_USER=${POSTGRES_USERNAME}"
   - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
   - "POSTGRES_DB=${POSTGRES_DB}"
   - "TZ=Asia/Tokyo"
  ports:
   - "${DB_HOST_MACHINE_PORT:-5432}:5432"
  volumes:
   - type: volume
     source: db-compose-volume
     target: /var/lib/postgresql/data

volumes:
 db-compose-volume:
